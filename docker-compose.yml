# Local development services only. Production uses Azure managed services.
services:
  # The application's database. SQL Server locally, Azure SQL Database in production: the same
  # engine, so the SQL the API sends is the SQL Azure will run.
  #
  # Full-text search is needed by the keyword search, and the stock Linux image does not always
  # carry it, so this builds a thin image on top that installs it. `docker compose up -d` builds it
  # once; after that it starts as quickly as any other container.
  sqlserver:
    build:
      context: ./docker/sqlserver
    image: hl-sqlserver:2022-fts
    container_name: hl-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Hl_dev_password_change_me1}
      MSSQL_PID: Developer       # free for development and testing, not for production use
    ports:
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"   # bound to localhost only
    volumes:
      - hl_mssqldata:/var/opt/mssql
    healthcheck:
      # -C trusts the container's self-signed certificate, which is the only thing it has locally.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite   # local emulator for Azure Blob Storage
    container_name: hl-azurite
    restart: unless-stopped
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - hl_azurite:/data

volumes:
  hl_mssqldata:
  hl_azurite:
