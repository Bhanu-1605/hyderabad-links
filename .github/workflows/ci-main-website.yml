name: CI · main-website

# Runs only when this app (or shared code) changes, so the three websites build independently.
on:
  pull_request:
    paths:
      - "apps/main-website/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci-main-website.yml"
  push:
    branches: [main]
    paths:
      - "apps/main-website/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci-main-website.yml"

permissions:
  contents: read

concurrency:
  group: ci-main-website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck -w apps/main-website
      - name: Build
        run: npm run build -w apps/main-website
