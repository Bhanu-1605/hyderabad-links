name: CI · api

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci-api.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci-api.yml"

permissions:
  contents: read

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/BusinessDirectory.sln
      - run: dotnet build backend/BusinessDirectory.sln --configuration Release --no-restore
      - run: dotnet test backend/BusinessDirectory.sln --configuration Release --no-build
