name: CI · database migrations

on:
  pull_request:
    paths:
      - "database/**"
      - "scripts/check-migrations*.mjs"
      - ".github/workflows/ci-database.yml"
  push:
    branches: [main]
    paths:
      - "database/**"
      - "scripts/check-migrations*.mjs"
      - ".github/workflows/ci-database.yml"

permissions:
  contents: read

jobs:
  migration-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Checker self-tests
        run: node --test "scripts/**/*.test.mjs"
      - name: Check migration naming, ordering and destructive statements
        run: node scripts/check-migrations.mjs
