```yaml
name: Deploy Hyderabad Links API to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/azure-api-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore backend/BusinessDirectory.Api/BusinessDirectory.Api.csproj

      - name: Build API
        run: dotnet build backend/BusinessDirectory.Api/BusinessDirectory.Api.csproj --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish backend/BusinessDirectory.Api/BusinessDirectory.Api.csproj --configuration Release --no-build --output ./publish

      - name: Upload published API
        uses: actions/upload-artifact@v4
        with:
          name: hyderabad-links-api
          path: ./publish/**

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download published API
        uses: actions/download-artifact@v4
        with:
          name: hyderabad-links-api
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: hyderabad-links-api
          slot-name: Production
          package: ./publish
```
